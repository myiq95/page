name: Build IPA - Premium + Icon + Background

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install
        run: |
          npm install -g @capacitor/cli@5.7.0
          npm install

      - name: Add iOS
        run: |
          cap add ios

      - name: Inject BackgroundTTS + Icon
        run: |
          echo "pod 'BackgroundTTS', :path => '../../ios-plugin'" >> ios/App/Podfile
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/App/App/Info.plist 2>/dev/null || true
          echo "=== Applying custom icon ==="
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          ls $ICONSET
          cp icons/AppIcon-*.png $ICONSET/ || true
          cp icons/Contents.json $ICONSET/Contents.json || true
          ls -lh $ICONSET/
          echo "Icon applied"

      - name: Copy web
        run: |
          cap copy ios

      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build
        run: |
          mkdir -p build
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ../../build/DerivedData build | tee ../../build/build.log
          cd ../..

      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "App.app" -type d | head -1)
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/App.app
          cd build
          zip -ry PAGES-Premium-Icon-Background.ipa Payload
          ls -lh *.ipa
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: PAGES-Premium-IPA
          path: |
            build/*.ipa
            build/build.log
          retention-days: 7
